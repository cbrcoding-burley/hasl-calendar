[project]
name = "hasl-calendar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Christian Reynolds", email = "christian.reynolds@flatiron.com" }
]
requires-python = ">=3.11.15"
dependencies = [
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "icalendar>=7.3.0",
    "lxml>=6.1.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
hasl-calendar = "hasl_calendar:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
